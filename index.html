<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fendyx</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f; --accent: #00f0ff;
      --gradient: linear-gradient(135deg, #00f0ff 0%, #7b2ff7 50%, #ff00ea 100%);
      --text: #ffffff; --text2: #a0a0b0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .auth-bg {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(123,47,247,0.15), transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(0,240,255,0.15), transparent 50%);
    }
    .container {
      width: 100%; max-width: 460px; padding: 2rem; margin: 0 auto; position: relative; z-index: 1;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .logo {
      width: 70px; height: 70px; margin: 0 auto 1.5rem;
      background: var(--gradient); border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700;
      box-shadow: 0 0 30px rgba(0,240,255,0.3);
    }
    h1 {
      font-size: 1.75rem; text-align: center; margin-bottom: 0.5rem;
      background: var(--gradient); -webkit-background-clip: text;
      background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { text-align: center; color: var(--text2); margin-bottom: 2rem; }
    .card {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 32px; backdrop-filter: blur(20px); padding: 2rem;
    }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text2); }
    input {
      width: 100%; padding: 0.875rem 1rem;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; color: white; font-size: 0.95rem;
    }
    input:focus { border-color: var(--accent); outline: none; }
    .btn {
      width: 100%; padding: 0.875rem; border: none; border-radius: 16px;
      background: var(--gradient); color: white; font-weight: 600;
      cursor: pointer; transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .footer { text-align: center; margin-top: 1.5rem; color: var(--text2); }
    .link { color: var(--accent); cursor: pointer; }
    .hidden { display: none !important; }
    .role-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
    .role-card {
      padding: 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; text-align: center; cursor: pointer; transition: all 0.3s;
    }
    .role-card:hover { border-color: var(--accent); transform: translateY(-3px); }
    .role-card.selected { background: rgba(0,240,255,0.1); border-color: var(--accent); }
    .role-icon { font-size: 1.75rem; margin-bottom: 0.5rem; }
    .role-name { font-weight: 600; font-size: 0.85rem; }
    .admin-panel { max-width: 600px; }
    .admin-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; }
    .stat-card {
      padding: 1.5rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; text-align: center;
    }
    .stat-value { font-size: 2rem; font-weight: 700; background: var(--gradient);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>
  <div class="auth-bg"></div>
  
  <!-- LOGIN VIEW - SIEMPRE VISIBLE AL INICIO -->
  <div class="container" id="loginView">
    <div>
      <div class="logo"></div>
      <h1>Bienvenido a Fendyx</h1>
      <p class="subtitle">Ingresa a tu cuenta</p>
      <div class="card">
        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" required placeholder="tu@correo.com" />
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="loginPassword" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn" id="loginBtn">Iniciar sesión</button>
        </form>
      </div>
      <div class="footer">¿No tienes cuenta? <span class="link" id="goRegister">Regístrate</span></div>
    </div>
  </div>

  <!-- REGISTER VIEW - OCULTO AL INICIO -->
  <div class="container hidden" id="registerView">
    <div>
      <div class="logo"></div>
      <h1>Crea tu cuenta</h1>
      <p class="subtitle">Únete a Fendyx</p>
      <div class="card">
        <form id="registerForm">
          <label>Tipo de cuenta</label>
          <div class="role-selector">
            <div class="role-card selected" data-role="user">
              <div class="role-icon"></div>
              <div class="role-name">Usuario</div>
            </div>
            <div class="role-card" data-role="restaurant">
              <div class="role-icon">🍔</div>
              <div class="role-name">Restaurante</div>
            </div>
            <div class="role-card" data-role="delivery">
              <div class="role-icon">🛵</div>
              <div class="role-name">Domiciliario</div>
            </div>
            <div class="role-card" data-role="club">
              <div class="role-icon">🎉</div>
              <div class="role-name">Discoteca</div>
            </div>
          </div>
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="regName" required />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" required />
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="regPassword" required />
          </div>
          <button type="submit" class="btn" id="registerBtn">Crear cuenta</button>
        </form>
      </div>
      <div class="footer">¿Ya tienes cuenta? <span class="link" id="goLogin">Inicia sesión</span></div>
    </div>
  </div>

  <!-- ADMIN VIEW - OCULTO AL INICIO -->
  <div class="container hidden" id="adminView">
    <div class="admin-panel">
      <div>
        <div class="logo">👑</div>
        <h1>Panel de Administrador</h1>
        <p class="subtitle">Control total</p>
        <div class="card">
          <p style="margin-bottom: 1rem;">Bienvenido, <strong id="adminName">Admin</strong></p>
          <p style="margin-bottom: 1.5rem;">Tokens: <strong style="color: var(--accent);" id="adminTokens">0</strong></p>
          <div class="admin-stats">
            <div class="stat-card">
              <div class="stat-value" id="statTokens">0</div>
              <div style="color: var(--text2); font-size: 0.875rem;">Tokens disponibles</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="statRole">admin</div>
              <div style="color: var(--text2); font-size: 0.875rem;">Rol</div>
            </div>
          </div>
          <button class="btn" id="logoutBtn" style="margin-top: 1.5rem;">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // INICIALIZACIÓN
    // ============================================
    let supabase = null;
    let currentUser = null;
    let userProfile = null;
    let selectedRole = 'user';

    // Crear cliente Supabase
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(
          'https://hzyjbwnedgpjzbaodilk.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6eWpid25lZGdwanpiYW9kaWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDUzNDMsImV4cCI6MjEwNDI4MTM0M30.koUX5Xi-eztsqztGlqRG0vagHFM642mcZCI_uR6lJb8'
        );
        console.log('✅ Supabase conectado');
      }
    } catch (e) {
      console.error('❌ Error Supabase:', e);
    }

    // ============================================
    // NAVEGACIÓN
    // ============================================
    function showView(viewName) {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('registerView').classList.add('hidden');
      document.getElementById('adminView').classList.add('hidden');
      document.getElementById(viewName + 'View').classList.remove('hidden');
    }

    // ============================================
    // LOGIN
    // ============================================
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Procesando...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        });

        if (error) throw error;

        const { data: profile } = await supabase
          .from('profiles')
          .select('*')
          .eq('user_id', data.user.id)
          .single();

        currentUser = data.user;
        userProfile = profile;

        if (profile.role === 'admin') {
          document.getElementById('adminName').textContent = profile.first_name;
          document.getElementById('adminTokens').textContent = profile.tokens;
          document.getElementById('statTokens').textContent = profile.tokens;
          showView('admin');
        } else {
          alert('Dashboard en construcción');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    });

    // ============================================
    // REGISTER
    // ============================================
    document.querySelectorAll('.role-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedRole = card.dataset.role;
      });
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = 'Creando...';

      try {
        const { data, error } = await supabase.auth.signUp({
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
          options: { data: { role: selectedRole, first_name: document.getElementById('regName').value } }
        });

        if (error) throw error;

        await supabase.from('profiles').insert([{
          user_id: data.user.id,
          email: document.getElementById('regEmail').value,
          role: selectedRole,
          first_name: document.getElementById('regName').value,
          tokens: 0,
          status: 'active'
        }]);

        alert('¡Cuenta creada! Ahora inicia sesión');
        showView('login');
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    });

    // ============================================
    // NAV LINKS
    // ============================================
    document.getElementById('goRegister').addEventListener('click', () => showView('register'));
    document.getElementById('goLogin').addEventListener('click', () => showView('login'));

    // ============================================
    // LOGOUT
    // ============================================
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (supabase) await supabase.auth.signOut();
      currentUser = null;
      userProfile = null;
      showView('login');
    });
  </script>
</body>
</html>
