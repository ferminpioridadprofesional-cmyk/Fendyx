<div class="auth-screen login-screen">
  <div class="auth-bg"></div>
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">⚡</div>
      <h1 class="auth-title text-gradient">Bienvenido a Fendyx</h1>
      <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>
    </div>
    <div class="card-glass">
      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Correo electrónico</label>
          <div class="input-wrapper">
            <span class="input-icon-left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
            <input type="email" id="loginEmail" class="input has-icon-left" placeholder="tu@correo.com" required />
          </div>
          <div class="input-error" id="loginEmailError">Ingresa un correo válido</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon-left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="loginPassword" class="input has-icon-left has-icon-right" placeholder="••••••••" required />
            <button type="button" class="input-icon-right toggle-password" data-target="loginPassword">
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="input-error" id="loginPasswordError">La contraseña es requerida</div>
        </div>
        <div class="login-options">
          <label class="checkbox-wrapper"><input type="checkbox" id="rememberMe" /><span>Recordarme</span></label>
          <a href="#" data-route="recover">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn"><span class="btn-text">Iniciar sesión</span></button>
      </form>
    </div>
    <div class="auth-footer">¿No tienes cuenta? <a href="#" data-route="register" class="auth-link">Regístrate gratis</a></div>
  </div>
</div>
